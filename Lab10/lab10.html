<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gene Search</title>
</head>

<body>

<h1>Gene Details</h1>
<form action="/cgi-bin/ensembl.py" method="GET">
    <h3>Enter gene stable ID:</h3>
    <input type="text" name="stable_id">
    <input type="hidden" name="action" value="stable">
    <input type="submit" value="Search">
</form>

<br><br>

<h1>Transcripts</h1>
<form action="/cgi-bin/ensembl.py" method="GET">
    <h3>Enter gene stable ID:</h3>
    <input type="text" name="gene_name">
    <input type="hidden" name="action" value="transcripts">
    <input type="submit" value="Search">
</form>

<br><br>

<h1>Chromosome Genes</h1>
<form action="/cgi-bin/ensembl.py" method="GET">
    <h3>Enter chromosome:</h3>
    <input type="text" name="chromosome">
    <input type="hidden" name="action" value="genes">
    <input type="submit" value="Search">
</form>

</body>
</html>
